# Noor Clothing — single VPS reverse proxy (optional path)
# web :3000 · admin :3001 · api :4000
#
# Certbot: certbot --nginx -d noorethnicwear.in -d noorethnicwear.in -d admin.… -d api.…

upstream noor_web   { server 127.0.0.1:3000; keepalive 16; }
upstream noor_admin { server 127.0.0.1:3001; keepalive 8; }
upstream noor_api   { server 127.0.0.1:4000; keepalive 16; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# ---------- storefront ----------
server {
  listen 80;
  server_name noorethnicwear.in noorethnicwear.in;
  return 301 https://noorethnicwear.in$request_uri;
}

server {
  listen 443 ssl http2;
  server_name noorethnicwear.in noorethnicwear.in;

  ssl_certificate     /etc/letsencrypt/live/noorethnicwear.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/noorethnicwear.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Next static assets — immutable
  location /_next/static/ {
    proxy_pass http://noor_web;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://noor_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# ---------- admin (noindex) ----------
server {
  listen 443 ssl http2;
  server_name admin.noorethnicwear.in;

  ssl_certificate     /etc/letsencrypt/live/admin.noorethnicwear.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.noorethnicwear.in/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # optional: office IP allowlist
  # allow 103.21.58.0/24; deny all;

  location / {
    proxy_pass http://noor_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ---------- api ----------
server {
  listen 443 ssl http2;
  server_name api.noorethnicwear.in;

  ssl_certificate     /etc/letsencrypt/live/api.noorethnicwear.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.noorethnicwear.in/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000" always;
  client_max_body_size 512k;

  location / {
    proxy_pass http://noor_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
