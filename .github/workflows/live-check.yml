name: Live site check

# Deployed GitHub Pages site par asli HTTP checks (iss runner me internet khulta hai,
# sandbox se github.io blocked hota hai). Report repo me commit ho jaati hai taaki
# har run ka proof `docs/09-devops/live-check.md` me rahe.
#
#   Actions → Live site check → Run workflow
#   (workflow_dispatch sirf tab dikhta hai jab ye file default branch par ho, isliye
#    branch push par bhi chalta hai — report commit par khud ko dobara nahi chalata.)

on:
  push:
    branches:
      - main
      - arena/f2c07741-pussya-product
      - arena/47281d99-pussya-product
      - arena/260f16c9-pussya-product
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site URL"
        required: false
        default: "https://noorethnicwear.store/"

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  check:
    # report ka apna commit (chore(audit)) loop na banaye
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(audit)')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url || 'https://noorethnicwear.store/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: URL diagnostics
        run: |
          {
            echo ""
            echo "## URLs probed (DNS + HTTP)"
            echo ""
            echo "| URL | DNS | HTTP | redirect |"
            echo "| --- | --- | --- | --- |"
            for u in "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" "https://noorethnicwear.store/"; do
              host=$(echo "$u" | sed -E 's#https://([^/]+)/.*#\1#')
              dns=$(getent hosts "$host" | awk '{print $1}' | paste -sd',' - || true)
              [ -n "$dns" ] || dns="no record"
              read -r code redir <<<"$(curl -sS -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "$u" 2>/dev/null || echo '000 -')"
              echo "| $u | $dns | $code | ${redir:--} |"
            done
            echo ""
            echo "### DNS records (Google DNS se poocha gaya)"
            echo ""
            echo "| name | type | value |"
            echo "| --- | --- | --- |"
            for pair in "noorethnicwear.store A" "noorethnicwear.store AAAA" "noorethnicwear.store CNAME" "www.noorethnicwear.store A" "www.noorethnicwear.store CNAME"; do
              name=${pair% *}
              type=${pair#* }
              curl -sS -m 15 "https://dns.google/resolve?name=${name}&type=${type}" \
                | node -e '
                  let raw = "";
                  process.stdin.on("data", (d) => (raw += d)).on("end", () => {
                    const [name, type] = process.argv.slice(1);
                    try {
                      const json = JSON.parse(raw);
                      const wanted = { A: 1, CNAME: 5, AAAA: 28 }[type];
                      for (const answer of json.Answer ?? []) {
                        if (answer.type !== wanted) continue;
                        console.log(`| ${name} | ${type} | ${String(answer.data).slice(0, 80)} |`);
                      }
                    } catch {}
                  });
                ' "$name" "$type" || true
            done
            www_cname=$(curl -sS -m 15 "https://dns.google/resolve?name=www.noorethnicwear.store&type=CNAME" | node -e '
              let raw="";process.stdin.on("data",d=>raw+=d).on("end",()=>{
                try{const j=JSON.parse(raw);const a=(j.Answer||[]).find(x=>x.type===5);if(a)console.log(String(a.data));}catch{}
              });' || true)
            echo ""
            if [ -n "$www_cname" ]; then
              echo "www CNAME → $www_cname"
            else
              echo "⚠️ \`www.noorethnicwear.store\` par CNAME nahi mila — GitHub custom domain verify nahi karega (setup: docs/09-devops/custom-domain-setup.md)"
            fi
          } > /tmp/urls.md
          cat /tmp/urls.md

      - name: Live checks
        run: node scripts/audit/live-check.mjs "$BASE_URL" --links=40 --out=docs/09-devops/live-check.md || echo "LIVE_CHECK_FAILED=1" >> "$GITHUB_ENV"

      - name: Append URL diagnostics to report
        if: always()
        run: cat /tmp/urls.md >> docs/09-devops/live-check.md || true

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/09-devops/live-check.md
          git diff --cached --quiet || git commit -m "chore(audit): live site check report ($BASE_URL)"
          git push

      - name: Summary
        run: cat docs/09-devops/live-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if checks failed
        if: env.LIVE_CHECK_FAILED == '1'
        run: exit 1
